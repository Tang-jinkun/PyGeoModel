services:
  backend:
    image: pygeomodel/backend:${PYGEOMODEL_IMAGE_TAG:-offline-amd64}
    restart: unless-stopped
    environment:
      PYGEOMODEL_DATA_DIR: /workspace/data
      PYGEOMODEL_CORS_ORIGINS: '${PYGEOMODEL_CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}'
      PYGEOMODEL_TIANDITU_TOKEN: ${PYGEOMODEL_TIANDITU_TOKEN:-}
      PYGEOMODEL_TIANDITU_REFERER: ${PYGEOMODEL_TIANDITU_REFERER:-}
    ports:
      - "${PYGEOMODEL_BACKEND_BIND:-127.0.0.1}:${PYGEOMODEL_BACKEND_PORT:-8000}:8000"
    volumes:
      - ../../data:/workspace/data
      - ../../data/import:/workspace/import:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    image: pygeomodel/frontend:${PYGEOMODEL_IMAGE_TAG:-offline-amd64}
    restart: unless-stopped
    environment:
      PYGEOMODEL_API_BASE_URL: '${PYGEOMODEL_API_BASE_URL-}'
      PYGEOMODEL_OFFLINE: '1'
    ports:
      - "${PYGEOMODEL_FRONTEND_BIND:-127.0.0.1}:${PYGEOMODEL_FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - const http=require('http'); const req=http.get('http://127.0.0.1:5173/',r=>process.exit(r.statusCode===200?0:1)); req.on('error',()=>process.exit(1)); req.setTimeout(3000,()=>process.exit(1));
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
